<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Diseño automático para formularios Django */
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow border-0" style="width: 400px; padding: 30px;">
        <h3 class="text-center fw-bold mb-4">Iniciar Sesión</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'inicio' %}" class="text-decoration-none text-muted">← Volver al catálogo</a>
        </div>
    </div>
</body>
</html>
