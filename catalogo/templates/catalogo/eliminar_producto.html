<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow border-0 p-4 text-center" style="max-width: 450px;">
        <h3 class="fw-bold text-danger mb-3">🗑️ ¿Eliminar producto?</h3>
        
        <p class="mb-4">¿Estás seguro de que deseas eliminar permanentemente <strong>{{ producto.nombre }}</strong> de la base de datos?<br>Esta acción no se puede deshacer.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 fw-bold mb-3">Sí, eliminar definitivamente</button>
        </form>
        
        <a href="{% url 'inicio' %}" class="text-decoration-none text-muted">Cancelar y volver al catálogo</a>
    </div>
</body>
</html>
