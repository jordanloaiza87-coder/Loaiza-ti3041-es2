<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Diseño automático para el formulario */
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow border-0 p-4">
            <h3 class="fw-bold mb-4 text-warning">✏️ Editar: {{ producto.nombre }}</h3>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 fw-bold text-dark mt-3">Guardar Cambios</button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'inicio' %}" class="text-decoration-none text-muted">← Cancelar y volver al catálogo</a>
            </div>
        </div>
    </div>
</body>
</html>
